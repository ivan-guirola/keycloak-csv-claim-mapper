services:
  keycloak:
    image: quay.io/keycloak/keycloak:26.6.0
    command: start-dev
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: admin
    ports:
      - "8080:8080"
    volumes:
      - ./target/keycloak-csv-claim-mapper.jar:/opt/keycloak/providers/keycloak-csv-claim-mapper.jar:ro
